<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Para ti 🎶</title>
  <style>
    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      background: linear-gradient(135deg, #f5f7fa, #c3cfe2);
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      text-align: center;
      margin: 0;
    }
    .card {
      background: white;
      padding: 2.5rem;
      border-radius: 20px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.1);
      max-width: 90%;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 15px;
    }
    h1 { color: #333; font-size: 1.5rem; margin: 0; }
    p { color: #666; font-size: 1rem; margin: 0; }
    
    /* Estilo para que el reproductor se vea integrado y bonito */
    audio {
      width: 100%;
      margin-top: 10px;
    }
  </style>
</head>
<body>

  <div class="card">
    <h1>Para ti 🎶</h1>
    <p>Disfruta de este audio exclusivo</p>
    
    <!-- Agregamos el atributo "controls" aquí -->
    <audio id="miAudio" controls preload="auto">
      <source src="p1.mp3" type="audio/mpeg">
      Tu navegador no soporta el elemento de audio.
    </audio>
  </div>

</body>
</html>
